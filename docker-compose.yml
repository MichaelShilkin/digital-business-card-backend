
services:
  postgres:
    image: postgres:16-alpine
    container_name: business-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: business_card
      POSTGRES_PASSWORD: business_card_dev
      POSTGRES_DB: business_card
    ports:
      - "5434:5432"
    volumes:
      - business_card_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_card -d business_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: business-card-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://business_card:business_card_dev@postgres:5432/business_card?schema=public
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  business_card_data:
