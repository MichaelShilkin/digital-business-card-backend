services:
  postgres:
    image: postgres:16-alpine
    container_name: business-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: business_card
      # The default is for local development only. Set POSTGRES_PASSWORD on any shared server.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-business_card_dev}
      POSTGRES_DB: business_card
    ports:
      # Published on localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5434:5432"
    volumes:
      - business_card_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_card -d business_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: business-card-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://business_card:${POSTGRES_PASSWORD:-business_card_dev}@postgres:5432/business_card?schema=public
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  business_card_data:
